name: Publish to npm

on:
  push:
    branches: [main]
    paths: ['package.json']
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish if version changed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: latest
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Read package version
        id: pkg
        run: |
          VERSION=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./package.json').name")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Check published version
        id: published
        run: |
          PUBLISHED=$(npm view "${{ steps.pkg.outputs.name }}" version 2>/dev/null || echo "0.0.0")
          echo "version=$PUBLISHED" >> "$GITHUB_OUTPUT"
          if [ "$PUBLISHED" = "${{ steps.pkg.outputs.version }}" ]; then
            echo "Already published version ${{ steps.pkg.outputs.version }}, nothing to do."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Local version ${{ steps.pkg.outputs.version }} differs from published $PUBLISHED — will publish."
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.published.outputs.should_publish == 'true'
        run: pnpm install --frozen-lockfile

      - name: Lint
        if: steps.published.outputs.should_publish == 'true'
        run: pnpm run lint

      - name: Typecheck
        if: steps.published.outputs.should_publish == 'true'
        run: pnpm run typecheck

      - name: Unit tests
        if: steps.published.outputs.should_publish == 'true'
        run: pnpm run test:unit

      - name: Publish to npm
        if: steps.published.outputs.should_publish == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public

      - name: Create git tag and GitHub release
        if: steps.published.outputs.should_publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.pkg.outputs.version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping tag creation."
          else
            git tag "$TAG"
            git push origin "$TAG"
            gh release create "$TAG" --generate-notes --title "$TAG"
          fi
