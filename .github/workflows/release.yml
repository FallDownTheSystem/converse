name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_current:
        description: 'Publish the current main version to npm directly, bypassing release-please gating. Use to recover a tagged-but-unpublished release.'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # pnpm 11 enables the minimumReleaseAge supply-chain gate by default;
      # this repo opts out so releases always install the newest matching deps.
      PNPM_CONFIG_MINIMUM_RELEASE_AGE: '0'
    steps:
      - name: Run release-please (open PR or tag merged release)
        if: ${{ github.event.inputs.publish_current != 'true' }}
        uses: googleapis/release-please-action@v5
        id: release1

      - name: Auto-merge release PR if one was created or updated
        if: ${{ github.event.inputs.publish_current != 'true' && steps.release1.outputs.prs_created == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Via env, never inlined into the script: the PR payload embeds commit
          # subjects, so an apostrophe would close the shell quote and the rest
          # would execute.
          RELEASE_PR: ${{ steps.release1.outputs.pr }}
        run: |
          PR_NUMBER=$(jq -r '.number' <<< "$RELEASE_PR")
          gh pr merge "$PR_NUMBER" --squash --repo "$GITHUB_REPOSITORY"

      - name: Re-run release-please to tag the just-merged release
        if: ${{ github.event.inputs.publish_current != 'true' && steps.release1.outputs.prs_created == 'true' }}
        uses: googleapis/release-please-action@v5
        id: release2

      - name: Determine if a release should be published
        id: gate
        run: |
          if [ "${{ github.event.inputs.publish_current }}" = "true" ] || [ "${{ steps.release1.outputs.release_created }}" = "true" ] || [ "${{ steps.release2.outputs.release_created }}" = "true" ]; then
            echo "release_created=true" >> "$GITHUB_OUTPUT"
          else
            echo "release_created=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v6
        if: steps.gate.outputs.release_created == 'true'
        with:
          ref: main

      - uses: pnpm/action-setup@v4
        if: steps.gate.outputs.release_created == 'true'
        with:
          version: latest
          run_install: false

      - uses: actions/setup-node@v6
        if: steps.gate.outputs.release_created == 'true'
        with:
          node-version: '24'
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        if: steps.gate.outputs.release_created == 'true'
        run: pnpm install --frozen-lockfile

      - name: Lint
        if: steps.gate.outputs.release_created == 'true'
        run: pnpm run lint

      - name: Typecheck
        if: steps.gate.outputs.release_created == 'true'
        run: pnpm run typecheck

      - name: Unit tests
        if: steps.gate.outputs.release_created == 'true'
        run: pnpm run test:unit

      # Pinned to the npm 11 line: Trusted Publishing needs >=11.5.1, and
      # npm@latest broke publishing when 12.0.0 shipped with a missing
      # 'sigstore' module in libnpmpublish. Bump deliberately, not by float.
      - name: Ensure OIDC-capable npm (Trusted Publishing needs >=11.5.1)
        if: steps.gate.outputs.release_created == 'true'
        run: npm install -g npm@11

      - name: Publish to npm (Trusted Publishing via OIDC)
        if: steps.gate.outputs.release_created == 'true'
        run: npm publish --access public
