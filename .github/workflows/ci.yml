name: CI

on:
  # Release PRs touch only these files and are merged by release.yml within
  # seconds of opening, so a run queued for one fails to load its deleted
  # merge ref. release.yml validates before publishing, and CI still runs on
  # the resulting push to main.
  pull_request:
    paths-ignore:
      - CHANGELOG.md
      - package.json
      - .release-please-manifest.json
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    env:
      # pnpm 11 enables the minimumReleaseAge supply-chain gate by default;
      # this repo opts out so installs always accept the newest matching deps.
      PNPM_CONFIG_MINIMUM_RELEASE_AGE: '0'
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: latest
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm run test:unit
