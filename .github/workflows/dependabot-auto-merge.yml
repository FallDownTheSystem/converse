name: Dependabot auto-merge

on: pull_request

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  dependabot:
    name: Approve and auto-merge
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Approve and enable auto-merge for patch and minor updates
        if: |
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr review --approve "$PR_URL"
          gh pr merge --auto --squash "$PR_URL"

      - name: Trigger release after merged patch/minor update
        if: |
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for attempt in $(seq 1 60); do
            MERGED_AT=$(gh pr view "$PR_URL" --json mergedAt --jq '.mergedAt')
            if [ "$MERGED_AT" != "null" ] && [ -n "$MERGED_AT" ]; then
              MERGE_SHA=$(gh pr view "$PR_URL" --json mergeCommit --jq '.mergeCommit.oid')
              EXISTING_RUN_ID=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/runs?branch=main&per_page=100" --jq ".workflow_runs[] | select(.head_sha == \"$MERGE_SHA\") | .id" | head -n 1)

              if [ -n "$EXISTING_RUN_ID" ]; then
                echo "Release workflow already exists for merge commit $MERGE_SHA (run $EXISTING_RUN_ID)."
              else
                gh workflow run release.yml --ref main
                echo "Triggered release workflow for merged Dependabot update at $MERGE_SHA."
              fi
              exit 0
            fi

            PR_STATE=$(gh pr view "$PR_URL" --json state --jq '.state')
            if [ "$PR_STATE" = "CLOSED" ]; then
              echo "Dependabot PR closed without merging; skipping release dispatch."
              exit 0
            fi

            sleep 10
          done

          echo "Timed out after 10 minutes waiting for the Dependabot PR to merge. Check the PR status and manually trigger release.yml if the merge completed later."
          exit 1

      - name: Flag major updates for human review
        if: steps.metadata.outputs.update-type == 'version-update:semver-major'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr edit "$PR_URL" --add-label "needs-review"
          gh pr comment "$PR_URL" --body "Major version update detected — manual review required before merge."
